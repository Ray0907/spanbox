{{define "base"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{if .Title}}{{.Title}} · {{end}}spanbox</title>
  <link rel="stylesheet" href="/static/app.css">
  {{if .Charts}}<link rel="stylesheet" href="/static/uPlot.min.css">{{end}}
  <script src="/static/htmx.min.js" defer></script>
  {{if .Charts}}<script src="/static/uPlot.min.js" defer></script>{{end}}
  <script src="/static/app.js" defer></script>
</head>
<body data-section="{{.Section}}">
  <!--
  THESIS: A compact trace workbench where hierarchy and evidence outrank decoration.
  OWN-WORLD: Dark ink surfaces, luminous rose signals, square corners, and hairline structure.
  STORY: Operators find a trace, scan its structure, then inspect the exact telemetry behind it.
  FIRST VIEWPORT: A precise navigation bar tops dense filters and operational data.
  -->
  <header class="topbar">
    <a class="brand" href="/" aria-label="spanbox traces"><span class="brand-mark"></span>spanbox</a>
    <nav aria-label="Primary navigation">
      <a href="/" {{if eq .Section "traces"}}aria-current="page"{{end}}>Traces</a>
      <a href="/sessions" {{if eq .Section "sessions"}}aria-current="page"{{end}}>Sessions</a>
      <a href="/dashboard" {{if eq .Section "dashboard"}}aria-current="page"{{end}}>Dashboard</a>
      <a href="/search" {{if eq .Section "search"}}aria-current="page"{{end}}>Search</a>
      {{if .SQLEnabled}}<a href="/sql" {{if eq .Section "sql"}}aria-current="page"{{end}}>SQL</a>{{end}}
    </nav>
    <span class="utc-note">Times in UTC</span>
  </header>
  <main class="shell">
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
