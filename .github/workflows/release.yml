name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out=spanbox_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}${{ matrix.ext }}
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$out" ./cmd/spanbox
          sha256sum "$out" > "$out.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            spanbox_*
  aur:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - id: gate
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: echo "enabled=${AUR_SSH_PRIVATE_KEY:+true}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled
      - name: set pkgver
        if: steps.gate.outputs.enabled
        run: |
          ver=${GITHUB_REF_NAME#v}
          [[ $ver =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "tag $GITHUB_REF_NAME is not a valid pkgver"; exit 1; }
          sed -i "s/^pkgver=.*/pkgver=$ver/; s/^pkgrel=.*/pkgrel=1/" deploy/aur/PKGBUILD
      # v4.2.0; pinned by SHA because this step receives the AUR SSH key
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        if: steps.gate.outputs.enabled
        with:
          pkgname: spanbox-bin
          pkgbuild: deploy/aur/PKGBUILD
          updpkgsums: true
          test: true
          commit_username: Ray Tien
          commit_email: ray.tien0907@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/ray0907/spanbox:${{ github.ref_name }}
            ghcr.io/ray0907/spanbox:latest
